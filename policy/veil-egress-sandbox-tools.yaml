# Veil egress policy v3 = infra/policy/veil-egress-gateway-only.yaml + FOUR exact gateway tool paths. Everything else stays denied.
# The sandbox has no internet. Tavily, document extraction, the allowlist and the approval outbox all live on the host, behind these paths.
# Apply: openshell policy set veil-hermes --policy policy/veil-egress-sandbox-tools.yaml --wait
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /opt/hermes
  - /proc
  - /dev/urandom
  - /app
  - /run/nemoclaw/managed-gateway-expected-exit
  - /etc
  - /var/log
  - /var/lib/dpkg
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  - /dev/pts
  - /sandbox/.hermes
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  # Veil M0: the ONLY allowed egress is the host-local Veil gateway.
  veil_gateway:
    name: veil_gateway
    endpoints:
    - host: host.openshell.internal   # Colima host (192.168.5.2) -> Mac 127.0.0.1:8000 where the gateway listens
      port: 8000
      protocol: rest
      enforcement: enforce
      allowed_ips:                    # OpenShell SSRF guard: private host-gateway IPs must be listed explicitly
      - '192.168.0.0/16'
      rules:
      - allow: { method: GET,  path: /v1/models }
      - allow: { method: POST, path: /v1/chat/completions }
      - allow: { method: POST, path: /v1/responses }
      - allow: { method: GET,  path: /tools/veil/claims }
      - allow: { method: POST, path: /tools/veil/audit }
      - allow: { method: POST, path: /tools/veil/lookup_appeal_rules }
      - allow: { method: POST, path: /tools/veil/queue_email }
    binaries:
    - path: /usr/bin/curl
    - path: /usr/local/bin/hermes
    - path: /opt/hermes/.venv/bin/python
    - path: /opt/hermes/.venv/bin/python3
  # Managed in-sandbox inference route (inference.local -> OpenShell gateway -> host-local gateway). Keeps Hermes working.
  managed_inference:
    name: managed_inference
    endpoints:
    - host: inference.local
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow: { method: POST, path: /v1/chat/completions }
      - allow: { method: POST, path: /v1/responses }
      - allow: { method: GET,  path: /v1/models }
    binaries:
    - path: /usr/local/bin/hermes
    - path: /usr/bin/python3.11
    - path: /opt/hermes/.venv/bin/python
