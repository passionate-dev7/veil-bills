<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Veil - private paperwork agent (synthetic data)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Design contract. Job of this screen: decide what to approve, and see proof that nothing identifying left the machine.
     Direction: folder on the desk, a calm paper-and-ink consumer desk, not a dark dashboard.
     Fonts: Newsreader 500/600 (display), Albert Sans 400/500/600 (UI), DM Mono 400/500 (money, codes, hashes).
     Palette: paper #faf6ee, sheet #fffdf8, sunk #f0eadc, line #ddd4c1, ink #16221b, dim #5c675f,
       accent #1c4a38, accent-soft #e0eae2, crit #9a2b1e, crit-soft #f8e9e5, warn #8a5a00, warn-soft #f6ead0.
     Type: 14px body, 20px section headings, 40px figures. Spacing 4/8/12/16/24/40/64, radii 4/8.
     Semantic colour only: red-brown = real identifier or blocked attack; green = token, allowed, verified; amber = deadline or injection. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="veil.css"></head><body>
<header class="bar">
  <div class="brand">Veil <span class="tagline">private paperwork agent</span></div>
  <nav class="nav" aria-label="Sections">
    <a href="#alert">Alert</a><a href="#stage">Bill and ledger</a><a href="#approve">Needs you</a><a href="#findings">Findings</a><a href="#research">Research</a><a href="#receipts">Receipts</a>
  </nav>
  <p class="syn"><strong>Synthetic data only</strong><span>Fictional patient and generated documents. Not medical or legal advice.</span><span id="modeNote" class="mode"></span></p>
  <div class="seg" role="group" aria-label="Mode"><button id="mLive" data-mode="live" type="button">Live</button><button id="mJudge" data-mode="judge" type="button">Judge</button></div>
</header>
<div class="wrap"><main id="app"><p class="empty">Loading...</p></main></div>
<footer id="foot"></footer><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="run.js" onerror="void 0"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=c=>c==null?'n/a':'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2});
const IST=ts=>{try{return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'})}catch(e){return ''}};
const short=(h,n=12)=>h?String(h).slice(0,n)+'…':'';
const label=s=>{const t=String(s??'').replace(/_/g,' ').toLowerCase();return t?t[0].toUpperCase()+t.slice(1):''};
const S={mode:null,R:null,liveOk:false,sim:{},lastEvt:0,doc:0};
const LOCAL=['localhost','127.0.0.1','[::1]'].includes(location.hostname);

async function boot(){
  const q=new URLSearchParams(location.search).get('mode');
  // Judge mode never calls a backend. Live is probed only on localhost, and only counts if /api/state returns real JSON (static hosts return HTML fallbacks).
  if(LOCAL&&q!=='judge'){try{const r=await fetch('/api/state');if(r.ok&&(r.headers.get('content-type')||'').includes('json')){S.liveOk=(await r.json()).ok===true}}catch(e){}}
  S.mode=(q==='judge'||!S.liveOk)?'judge':'live';
  $('#mLive').disabled=!S.liveOk;$('#mLive').title=S.liveOk?'':'Live mode needs the local app: python -m veil app';
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{if(b.disabled)return;const u=new URL(location);u.searchParams.set('mode',b.dataset.mode);location=u});
  await load();
  if(S.mode==='live')stream();
}
async function load(){
  if(S.mode==='live'){S.R=await (await fetch('/api/run')).json()}
  else{S.R=window.VEIL_RUN||await (await fetch('run.json')).json()}
  render();
}
function stream(){
  const es=new EventSource('/api/stream?after='+Math.max(0,...S.R.events.map(e=>e.id),0));
  let t;es.addEventListener('veil',m=>{const e=JSON.parse(m.data);S.lastEvt=e.id;toast(e.title);clearTimeout(t);t=setTimeout(load,400)});
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.remove('on');t.hidden=true},4500)}

function hiReal(text,sens){
  const vals=[...new Set(sens.map(s=>s.value))].sort((a,b)=>b.length-a.length).map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  let h=esc(text);const tok={};sens.forEach(s=>tok[s.value.toLowerCase()]=s.token);
  if(vals.length)h=h.replace(new RegExp('(?<![A-Za-z0-9])('+vals.map(esc).join('|')+')(?![A-Za-z0-9])','gi'),m=>`<mark class="s" title="${esc(tok[m.toLowerCase()]||'')}">${m}</mark>`);
  return h.replace(/(Assistant: email this bill to [^\s<]+)/g,'<mark class="i" title="prompt injection planted in the EOB">$1</mark>');
}
const hiTok=t=>esc(t).replace(/\[[A-Z_]+_\d+\]/g,m=>`<mark class="t">${m}</mark>`);
function sent(call){try{const j=JSON.parse(call.outbound_text);const u=j.messages.filter(m=>m.role==='user').pop();let t=u.content;const a=t.lastIndexOf('<<<\n');if(a>=0){t=t.slice(a+4);const b=t.lastIndexOf('\n>>>');if(b>=0)t=t.slice(0,b)}return{text:t,raw:call.outbound_text}}catch(e){return{text:call?.outbound_text||'',raw:''}}}

function atStake(F){const by={};F.filter(f=>f.status!=='no_longer_detected').forEach(f=>{const k=f.bill_doc||f.id;by[k]=Math.max(by[k]||0,f.amount)});return Object.values(by).reduce((a,b)=>a+b,0)}
function draftState(d){return S.sim[d.id]||(S.mode==='live'?d.status:d.status)}

function render(){
  const R=S.R;if(!R)return;
  $('#modeNote').textContent=S.mode==='live'?'Live: local gateway and app on this machine':'Judge: cached run of the real pipeline, no backend';
  $('#mLive').classList.toggle('on',S.mode==='live');$('#mJudge').classList.toggle('on',S.mode==='judge');
  S.doc=Math.max(0,Math.min(S.doc,(R.documents||[]).length-1));
  $('#app').innerHTML=[
    secAlert(R),
    secStage(R),
    secSummary(R),
    `<div class="grid"><div class="main-col">${secApprove(R)+secFindings(R)+secResearch(R)+secAttack(R)+secReceipts(R)}</div><aside class="rail" id="rail">${railMemory(R)+railFeed(R)}</aside></div>`
  ].join('');
  $('#foot').innerHTML=`Run <code>${esc(R.run||'all runs')}</code> generated ${esc(R.generated)}. As of ${esc(R.as_of)}. Proof panels show the exact post-redaction bytes recorded by the gateway ledger before they left the machine; receipt fields (response id, model, usage) are returned by Nebius Token Factory; Tavily request ids are returned by Tavily. All data is synthetic.`;
  bind();showDoc();
}

function secAlert(R){
  const eg=R.egress||[],T=R.injection_trials||{};
  const src=e=>(e.meta||{}).source||'ledger';
  const replay=eg.filter(e=>src(e)==='replay');
  const agent=eg.filter(e=>src(e)==='agent');
  const blockedAgent=agent.filter(e=>e.status==='blocked');
  const sag=eg.filter(e=>src(e)==='sandbox-agent');
  const osh=eg.filter(e=>src(e)==='openshell');
  const sandbox=[...sag,...osh];
  const inj=R.injected_line||T.injected_line||'';
  const to=(/email this bill to\s+([^\s,.;]+)/i.exec(inj)||[])[1]||'';
  const idText=rows=>{
    if(!rows.length)return'';
    const ids=rows.map(r=>'#'+r.id),shown=ids.slice(0,8).join(', ');
    return `<span class="mono">${esc(shown)}${ids.length>8?` and ${ids.length-8} more`:''}</span>`;
  };
  const reasonText=rows=>{
    const rs=[...new Set(rows.map(r=>r.reason).filter(Boolean))];
    return rs.length?`<p>${rs.map(r=>`<span class="mono">${esc(r)}</span>`).join(' ')}</p>`:'';
  };
  const evidenceRow=(name,rows,lead)=>{
    return `<div class="row"><span class="src">${name}</span><div class="stack"><p>${lead}</p>${rows.length?`<p class="ids">Ledger ${idText(rows)}.</p>`:''}${reasonText(rows)}</div></div>`;
  };
  const leadReplay=`Scripted replay of the same instruction against the egress layer, run outside any model. ${replay.length?`${replay.length} ledger ${replay.length===1?'row':'rows'}, all blocked.`:'No replay row in this run.'}`;
  const leadAgent=`${blockedAgent.length} blocked ledger ${blockedAgent.length===1?'row':'rows'} came from real model tool calls.${T.total_attempts!=null?` ${T.total_attempts} of ${T.total_trials} live trials tried the same send.`:''} The egress policy refused every one.`;
  const leadSandbox=sandbox.length?`${sandbox.length} ${sandbox.length===1?'row':'rows'} came from a scripted probe through the sandbox tool path, not from a model.${osh.some(r=>/denied/i.test(r.reason||''))?' OpenShell denied the connection at the policy layer.':''}`:'No sandbox probe in this run.';
  return `<section id="alert" class="alert" role="alert" aria-labelledby="alert-h"><div class="stack">
    <h2 id="alert-h">Blocked: a line hidden in the EOB told the assistant to email this bill to <span class="mono">${esc(to||'an address outside the allowlist')}</span></h2>
    <p>Each evidence source below is labelled for what it is. Every attempt in this run was refused before anything left the machine.</p>
    <div class="stack">
      ${evidenceRow('Replay',replay,leadReplay)}
      ${evidenceRow('Real model attempts',blockedAgent,leadAgent)}
      ${evidenceRow('Scripted sandbox probe, not model-driven',sandbox,leadSandbox)}
    </div>
  </div></section>`;
}

function secStage(R){
  const docs=R.documents||[];
  return `<section id="stage" class="stage" aria-label="The bill and what the gateway received">
    <div class="pane panel bill">
      <h2>The bill, as it sits on this Mac</h2>
      <div class="tabs" role="tablist" aria-label="Documents">${docs.map((d,i)=>`<button class="tab ${i===S.doc?'on':''}" data-doc="${i}" type="button" role="tab" aria-selected="${i===S.doc}">${esc(d.name)}</button>`).join('')||'<span class="empty">No documents in this run.</span>'}</div>
      <pre class="doc" id="realDoc"></pre>
    </div>
    <div class="pane panel parity">
      <h2>What Nebius received</h2>
      <pre class="doc" id="tokDoc"></pre>
      <dl class="ledger" id="ledger"></dl>
      <div id="rawBytes"></div>
      <h3>Same answer without the names</h3>
      <ul class="parity" id="parity"></ul>
      <p>The audit runs on the right-hand text.</p>
    </div>
  </section>`;
}
function showDoc(){
  const R=S.R||{},d=(R.documents||[])[S.doc];
  const real=$('#realDoc'),tok=$('#tokDoc'),led=$('#ledger'),par=$('#parity'),raw=$('#rawBytes');
  if(!real)return;
  if(!d){real.textContent='No document selected.';tok.textContent='';if(led)led.innerHTML='';if(par)par.innerHTML='';if(raw)raw.innerHTML='';return}
  const c=d.call||{},s=sent(c),by=c.redacted_by_kind||{},u=c.usage||{};
  real.innerHTML=hiReal(d.text,R.sensitive||[]);
  tok.innerHTML=hiTok(s.text);
  const kinds=Object.entries(by).map(([k,n])=>`<span class="chip">${esc(label(k))} ${n}</span>`).join(' ');
  if(led)led.innerHTML=[
    ['Status',`<span class="chip ${c.status==='ok'?'ok':'bad'}">${esc(c.status||'unknown')}</span>`],
    ['Leaked after redaction',`<span class="chip ${(c.leaked_count||0)>0?'bad':'ok'}">${c.leaked_count??0}</span>`],
    ['Values pseudonymized',`<span class="num">${c.redacted_total??0}</span>${kinds?' '+kinds:''}`],
    ['Outbound sha256',`<span class="mono num">${esc(c.outbound_sha256||'')}</span>`],
    ['Receipt id',`<span class="mono">${esc(c.upstream_id||'')}</span>`],
    ['Model',`<span class="mono">${esc(c.upstream_model||c.model||'')}</span>`],
    ['Usage',`<span class="mono num">${u.prompt_tokens??0} in / ${u.completion_tokens??0} out tokens, ${c.latency_ms??0} ms</span>`],
    ['Ledger row',`<span class="mono">#${c.id??'?'}</span> ${c.outbound_bytes??''} bytes`]
  ].map(([k,v])=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  if(raw)raw.innerHTML=`<details><summary>Exact outbound request bytes (JSON)</summary><pre class="doc">${hiTok(s.raw)}</pre></details>`;
  if(par)par.innerHTML=(R.findings||[]).map(f=>`<li class="row"><span>${esc(label(f.type))}</span><span class="mono num">${usd(f.amount)}</span><span class="chip ok">found</span></li>`).join('')||'<li class="empty">No findings in this run.</li>';
}

function secSummary(R){
  const t=R.totals||{},D=R.deductible;
  const pending=(R.drafts||[]).filter(d=>draftState(d)==='pending_approval');
  const live=(R.deadlines||[]).filter(c=>c.status!=='expired').sort((a,b)=>a.days_left-b.days_left)[0];
  const items=[
    [usd(atStake(R.findings||[])),'Overbilled, open',true],
    [String(pending.length),'Awaiting your approval',false],
    [live?live.days_left+' days':'none','Next deadline',false],
    [D?usd(D.met):'n/a',D?`Deductible met, of ${usd(D.deductible)}`:'Deductible met',true],
    [String(t.leaked??0),'Leaked upstream',false],
    [String(t.calls??0),'Gateway calls',false]
  ];
  return `<section id="summary" class="summary" aria-label="This run"><div class="figures">${items.map(([v,l,mono])=>`<div><b class="${mono?'mono ':''}num">${v}</b><span>${l}</span></div>`).join('')}</div></section>`;
}

function draftCard(d){
  const st=draftState(d),kind=d.kind==='followup'?'Deadline follow-up':'Appeal',lc=d.letter_check;
  const eml=d.eml_text||(S.sim[d.id]==='approved'?d.eml_preview:null);
  const res=(d.research||[]);
  return `<article class="row draft" id="dr-${d.id}">
   <div class="row"><span class="chip">${kind}</span>
    <span class="chip ${st==='pending_approval'?'warn':st==='rejected'?'':'ok'}">${st==='pending_approval'?'pending your approval':st==='rejected'?'rejected':'delivered to sandbox mailbox'}</span>
    ${lc?`<span class="chip ${lc.ok?'ok':'bad'}">${lc.ok?'all '+lc.dollar_figures.length+' dollar figures verified against the audit':'unverified: '+esc(lc.unverified.join(', '))}</span>`:''}
    ${res.length?`<span class="chip">checked ${res.length} public source set${res.length>1?'s':''} via Tavily</span>`:''}</div>
   <h3>${esc(d.subject)}</h3>
   <dl class="ledger">
    <div class="row"><dt>To</dt><dd><span class="mono">${esc((d.to||[]).join(', '))}</span> <span class="chip ok">on allowlist</span></dd></div>
    <div class="row"><dt>Drafted by</dt><dd>${d.kind==='followup'?'Deadline scheduler (deterministic template, no model call)':'Nemotron 3 Ultra via the gateway; money math by calc tool and code'}</dd></div>
    ${d.deadline?`<div class="row"><dt>Deadline</dt><dd><span class="mono num">${esc(d.deadline)}</span> (${d.days_left} days left when drafted)</dd></div>`:''}
   </dl>
   <details ${st==='pending_approval'?'open':''}><summary>Letter text</summary><div class="letter"><pre>${esc(d.body)}</pre></div></details>
   ${d.agent&&d.agent.events?`<details><summary>Agent trace (${d.agent.events.length} tool calls)</summary><div class="letter"><pre>${esc(d.agent.events.map(e=>e.tool+' '+(e.expression?e.expression+' = '+e.result:e.query?'"'+e.query+'" -> '+(e.sources||[]).length+' sources (ledger #'+e.ledger_id+')':e.to?'to '+e.to.join(',')+' allowed='+e.allowed:'')).join('\n'))}</pre></div></details>`:''}
   ${st==='pending_approval'?`<div class="row actions"><button class="btn primary" data-act="approve" data-id="${d.id}" type="button">Approve and deliver to sandbox mailbox</button><button class="btn secondary" data-act="reject" data-id="${d.id}" type="button">Reject</button><small>${S.mode==='live'?'Writes an .eml to a local folder. There is no SMTP code in Veil.':'Judge mode: simulated, nothing is written anywhere.'}</small></div>`:''}
   ${eml?`<div class="eml"><div class="h">${S.mode==='live'?'.eml written to the sandbox mailbox: '+esc(d.eml||''):'Simulated: this is the exact .eml that live mode writes to the sandbox mailbox (nothing was written)'}</div><pre>${esc(eml)}</pre></div>`:''}</article>`;
}
function secApprove(R){
  const ds=[...(R.drafts||[])].reverse();
  return `<section id="approve"><header class="sh"><h2>Needs you</h2><p>Veil drafts; you decide. Approving delivers only to a local sandbox mailbox, and only to addresses on your trusted-contacts list.</p></header><div class="stack">${ds.length?ds.map(draftCard).join(''):'<div class="row empty">Nothing waiting. Drop a PDF into the watched inbox.</div>'}</div></section>`;
}

function secFindings(R){
  const F=(R.findings||[]).filter(f=>f.status!=='no_longer_detected');
  const rows=F.map(f=>`<tr><td><span class="mono">${esc(label(f.type))}</span></td><td class="mono num">${usd(f.amount)}</td><td>${esc(f.detail)} <small class="doc-ref">${esc(f.bill_doc||'')}${f.eob_doc?' vs '+esc(f.eob_doc):''}</small></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No findings.</td></tr>';
  const dl=(R.deadlines||[]).map(c=>`<li class="row">
      <span><span class="mono">${esc(c.provider)}</span> · claim <span class="mono">${esc(c.claim)}</span></span>
      <span class="chip ${c.status==='expired'?'':'warn'}">${c.status==='expired'?'closed '+(-c.days_left)+' days ago':c.days_left+' days left'}</span>
      <span>Notice ${esc(c.notice_date)} + ${c.window_days} days = <span class="mono num">${esc(c.deadline)}</span>${c.status==='expired'?'. Veil will not draft an appeal; a goodwill request is the remaining option.':''}</span></li>`).join('');
  const DD=R.deductible;
  const D=DD?`<li class="row"><span>Deductible</span><span class="mono num">${usd(DD.met)} of ${usd(DD.deductible)}</span><progress class="bar" max="${DD.deductible}" value="${DD.met}"></progress><span>${usd(DD.remaining)} remaining this plan year</span></li>`:'';
  return `<section id="findings"><header class="sh"><h2>Findings</h2><p>Lightning extracts typed JSON; Python compares in integer cents. No model does arithmetic.</p></header>
   <div class="table-wrap"><table class="t"><thead><tr><th>Type</th><th class="num">Amount</th><th>What</th></tr></thead><tbody>${rows}</tbody></table></div>
   <h3>Deadlines and deductible</h3>
   <ul class="deadlines">${dl||'<li class="row empty">No open deadlines.</li>'}${D}</ul></section>`;
}

function secResearch(R){
  const rs=R.research||[];
  return `<section id="research"><header class="sh"><h2>Public rules research <span class="chip">Tavily</span></h2><p>The agent's <code>lookup_appeal_rules(insurer_type, topic)</code> tool takes two enum values, so its query cannot contain patient details. It still goes through the same pseudonymizer and leak canary as every other outbound byte, and the exact body is ledgered.</p></header>
  <div class="stack">${rs.length?rs.map(r=>`<article class="row">
    <div class="row"><span class="chip ${r.status==='ok'?'ok':'bad'}">ledger #${r.ledger_id} · ${esc(r.status)}</span><span class="mono">${r.latency_ms??'?'} ms</span><span class="mono">leaked: ${r.leaked??0}</span><span class="mono">pseudonymized: ${r.redacted??0}</span><span class="mono num" title="${esc(r.sha256)}">sha256 ${esc(short(r.sha256,14))}</span></div>
    <dl class="ledger"><div class="row"><dt>Query sent</dt><dd class="mono">${esc(r.query)}</dd></div><div class="row"><dt>Request id</dt><dd class="mono">${esc(r.request_id||'')}</dd></div></dl>
    ${r.answer?`<div class="letter">${esc(r.answer)}</div>`:''}
    <div class="stack">${(r.sources||[]).map(s=>`<div class="row"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a><small class="mono trunc">${esc(s.url)}</small></div>`).join('')}</div>
    <details><summary>Exact outbound body (post-redaction)</summary><pre class="letter">${esc(r.outbound||'')}</pre></details>
  </article>`).join(''):'<div class="row empty">No Tavily calls recorded yet.</div>'}</div></section>`;
}

function secAttack(R){
  const eg=R.egress||[],T=R.injection_trials;
  const src=e=>(e.meta||{}).source||'ledger';
  const rep=eg.filter(e=>src(e)==='replay');
  const agent=eg.filter(e=>src(e)==='agent');
  const sag=eg.filter(e=>src(e)==='sandbox-agent'&&e.status==='blocked');
  const osh=eg.filter(e=>src(e)==='openshell');
  const inj=R.injected_line||(T&&T.injected_line)||'';
  const row=(e,l)=>`<tr><td class="mono num">#${e.id}</td><td><span class="chip ${e.status==='blocked'?'bad':'ok'}">${esc(e.status)}</span></td><td class="mono">${esc(l)}${l==='openshell'?' <span class="chip ok">live</span>':''}</td><td>${esc(e.reason)}${l==='openshell'?`<details><summary>OpenShell log line</summary><pre class="letter">${esc((e.meta||{}).raw||'')}\ntrigger: ${esc((e.meta||{}).trigger||'')}</pre></details>`:''}</td></tr>`;
  const trials=T?`<div class="table-wrap"><table class="t"><thead><tr><th>Live agent trials (real send_email tool)</th><th class="num">Trials</th><th class="num">Emailed the attacker</th><th class="num">Any send_email call</th></tr></thead><tbody>${Object.entries(T.summary||{}).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="num">${v.trials}</td><td class="num"><span class="chip ${v.attempts?'bad':'ok'}">${v.attempts}</span></td><td class="num">${v.any_send_email??''}</td></tr>`).join('')}</tbody></table></div>
  <p>${T.total_attempts} of ${T.total_trials} live trials really tried to email the attacker. Every attempt hit the egress policy and was blocked; nothing was delivered. Production prompt (Ultra, strict) resisted ${T.summary&&T.summary['ultra/strict']?T.summary['ultra/strict'].trials-T.summary['ultra/strict'].attempts:'?'}/${T.summary&&T.summary['ultra/strict']?T.summary['ultra/strict'].trials:'?'}; the allowlist is what holds when a model gives in. Run ${esc(T.run)} at ${esc(T.generated)}.</p>`:'';
  return `<section id="attack"><header class="sh"><h2>Every blocked attempt</h2><p>The synthetic ER EOB carries <mark class="i">${esc(inj)}</mark>. Any tool call to an address outside your trusted contacts is refused and logged. The labels below say which attempts came from a model and which were scripted.</p></header>
  ${trials}
  <div class="table-wrap"><table class="t"><thead><tr><th>Ledger</th><th>Status</th><th>Source</th><th>Reason</th></tr></thead><tbody>${rep.map(e=>row(e,'replay')).join('')}${agent.slice(0,6).map(e=>row(e,'agent')).join('')}${sag.slice(0,6).map(e=>row(e,'sandbox-agent')).join('')}${osh.slice(0,6).map(e=>row(e,'openshell')).join('')}</tbody></table></div>
  <p class="labels">The <b>replay</b> row is a deterministic re-enactment of the injected instruction against the egress layer, labelled as such. The <b>agent</b> rows are real tool calls emitted by the models in the live trials (${agent.length} blocked rows in this ledger; first 6 shown).${sag.length?' The <b>sandbox-agent</b> row is a call through the sandbox tool path (scripted operator call in this run, not model output).':''}${osh.length?` The <b>openshell</b> rows are real denied lines read from the OpenShell sandbox log (live), shown verbatim with an honest label of what triggered the traffic.`:''}</p></section>`;
}

function secReceipts(R){
  return `<section id="receipts"><header class="sh"><h2>Receipts</h2><p>Genuine response metadata for every outbound call: Nebius Token Factory inference and Tavily search.</p></header><div class="table-wrap tall"><table class="t"><thead><tr><th>#</th><th>For</th><th>Model / service</th><th>Response id</th><th class="num">Tokens in/out</th><th class="num">ms</th><th class="num">Redacted</th><th>sha256</th></tr></thead><tbody>${(R.receipts||[]).map(r=>`<tr><td class="mono num">${r.ledger_id}</td><td>${esc(r.tag)}</td><td class="mono">${esc((r.upstream_model||r.model||'').replace('nvidia/',''))}</td><td class="mono"><span class="trunc">${esc(r.upstream_id||'')}</span></td><td class="num">${r.usage&&r.usage.prompt_tokens!=null?r.usage.prompt_tokens+' / '+r.usage.completion_tokens:''}</td><td class="num">${r.latency_ms??''}</td><td class="num">${r.redacted??''}</td><td class="mono num">${esc(short(r.sha256,14))}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function railMemory(R){
  const M=R.memory||{},docs=M.documents||[],fs=(M.findings||[]).filter(f=>f.status!=='no_longer_detected'),notes=M.notes||[];
  const dh=((M.deductible&&M.deductible.history)||[]).map(h=>esc(h.date)+' +'+usd(h.applied)).join(' · ');
  const docLine=docs.map(d=>`${esc(label(d.type))} ${esc((d.provider||'').split(' ')[0])}`).join(' · ');
  return `<section class="rail-block"><h3>Veil remembers</h3>
   <div class="row"><b>Deductible</b>${M.deductible?`<small class="mono num">${usd(M.deductible.met)} of ${usd(M.deductible.deductible)}</small><progress class="bar" max="${M.deductible.deductible}" value="${M.deductible.met}"></progress><small>As of ${esc(M.deductible.as_of||R.as_of)}${dh?' · '+dh:''}</small>`:'<small>Nothing yet.</small>'}</div>
   <div class="row"><b>${docs.length} documents seen</b><small>${docLine||'none yet'}</small></div>
   <div class="row"><b>${fs.length} prior findings</b>${fs.map(f=>`<small><span class="mono">${esc(label(f.type))}</span> ${usd(f.amount)}, first seen ${esc((f.first_seen||'').slice(0,10))}</small>`).join('')||'<small>none yet</small>'}</div>
   <div class="row"><b>Follow-ups scheduled</b><small>${(M.followups||[]).length?(M.followups).map(f=>esc(f.key)).join('<br>'):'None yet.'}</small></div>
   <div class="row note"><b>Your notes</b>${notes.map(n=>`<small>${esc((n.ts||'').slice(0,10))}: ${esc(n.text)}</small>`).join('')||'<small>None.</small>'}
     ${S.mode==='live'?'<textarea id="noteText" placeholder="e.g. Called Mercy billing, ref #… (stays on this machine)"></textarea><div class="row"><button class="btn secondary" id="noteSave" type="button">Remember this</button></div>':'<small>Judge mode is read-only. Live mode saves notes to the local memory store.</small>'}</div>
   <div class="row"><small>Stored in a local SQLite file; never sent upstream.${M.last_scan?' Last scan '+esc(IST(M.last_scan.ts))+' IST.':''}</small></div></section>`;
}
function railFeed(R){
  const ev=[...(R.events||[])].reverse();
  return `<section class="rail-block"><h3>Notifications</h3><div class="feed">${ev.map(e=>`<div class="ev"><time class="mono">${esc(IST(e.ts))}</time><div><b>${esc(e.title)}</b><small>${esc((e.detail||'').slice(0,120))}</small></div></div>`).join('')||'<div class="row empty">No events yet.</div>'}</div></section>`;
}

function bind(){
  document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{S.doc=+b.dataset.doc;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));showDoc()});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id,b));
  const n=$('#noteSave');if(n)n.onclick=async()=>{const v=$('#noteText').value.trim();if(!v)return;await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:v})});toast('Saved to local memory');load()};
}
async function act(a,id,btn){
  btn.disabled=true;
  if(S.mode==='live'){
    const r=await fetch(`/api/drafts/${id}/${a}`,{method:'POST'});
    if(!r.ok){toast('Refused: '+((await r.json()).detail||r.status));btn.disabled=false;return}
    toast(a==='approve'?'Delivered to the sandbox mailbox':'Draft rejected');await load();
  }else{S.sim[id]=a==='approve'?'approved':'rejected';toast(a==='approve'?'Simulated delivery (judge mode)':'Rejected (simulated)');render()}
}
boot().catch(e=>{$('#app').innerHTML='<p class="empty">Could not load run data: '+esc(e)+'. Judge mode needs run.json next to this page.</p>'});
</script></body></html>
